<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#071510" />
    </linearGradient>

    <!-- Emerald Ambient Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#059669" stop-opacity="0.10" />
      <stop offset="80%" stop-color="#047857" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#080c10" stop-opacity="0" />
    </radialGradient>

    <!-- Sleek Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="1" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Head Gradient -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Ear Gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: 8px;
        fill: #ffffff;
      }
      .brand-title-glow {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: 8px;
        fill: #34d399;
        opacity: 0.45;
      }
      .sub-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        fill: #34d399;
      }
      .tagline-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
        font-size: 12.5px;
        letter-spacing: 1px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="850" height="260" rx="12" fill="url(#bg)" />

  <!-- Ambient Emerald Aura -->
  <circle cx="425" cy="85" r="190" fill="url(#emeraldGlow)" />

  <!-- Subtle Minimal Tech Grid/Particles -->
  <g opacity="0.3">
    <circle cx="120" cy="50" r="1.5" fill="#34d399" />
    <circle cx="200" cy="180" r="1" fill="#fff" />
    <circle cx="320" cy="65" r="1.5" fill="#34d399" />
    <circle cx="530" cy="65" r="1.5" fill="#34d399" />
    <circle cx="650" cy="180" r="1" fill="#fff" />
    <circle cx="730" cy="50" r="1.5" fill="#34d399" />
  </g>

  <!-- Modern Border Frame with Emerald Accent -->
  <rect x="1" y="1" width="848" height="258" rx="11" fill="none" stroke="#162620" stroke-width="1.5" />
  <rect x="8" y="8" width="834" height="244" rx="8" fill="none" stroke="#10b981" stroke-opacity="0.16" stroke-width="1" />

  <!-- Corner Tech Brackets -->
  <path d="M 16 30 L 16 16 L 30 16" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" fill="none" />
  <path d="M 834 30 L 834 16 L 820 16" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" fill="none" />
  <path d="M 16 230 L 16 244 L 30 244" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" fill="none" />
  <path d="M 834 230 L 834 244 L 820 244" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" fill="none" />

  <!-- Minimalist Geometric Panda Mascot Mark -->
  <g id="panda-emblem" transform="translate(425, 58)">
    <!-- Ears -->
    <circle cx="-29" cy="-21" r="14" fill="url(#earGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="-29" cy="-21" r="7" fill="#10b981" fill-opacity="0.25" />

    <circle cx="29" cy="-21" r="14" fill="url(#earGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="29" cy="-21" r="7" fill="#10b981" fill-opacity="0.25" />

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="34" ry="29" fill="url(#headGrad)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))" />

    <!-- Eye Patches -->
    <ellipse cx="-13" cy="-2" rx="9.5" ry="7.5" transform="rotate(-18 -13 -2)" fill="#0f172a" />
    <ellipse cx="13" cy="-2" rx="9.5" ry="7.5" transform="rotate(18 13 -2)" fill="#0f172a" />

    <!-- Eyes (Intelligent Emerald Gaze) -->
    <circle cx="-12" cy="-2" r="3" fill="#10b981" />
    <circle cx="-11" cy="-3" r="1.1" fill="#ffffff" />

    <circle cx="12" cy="-2" r="3" fill="#10b981" />
    <circle cx="13" cy="-3" r="1.1" fill="#ffffff" />

    <!-- Nose -->
    <path d="M -4 7 C -4 5, 4 5, 4 7 C 4 9.5, -4 9.5, -4 7 Z" fill="#0f172a" />

    <!-- Sleek Smile -->
    <path d="M -5 13 Q 0 16 5 13" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" fill="none" />

    <!-- Tiny Bamboo Leaf Accent on Side -->
    <path d="M 33 -10 C 44 -15 48 -5 36 -3 C 33 -4 32 -7 33 -10 Z" fill="#10b981" fill-opacity="0.85" />
    <path d="M 32 -1 C 41 5 44 14 34 11 C 32 9 31 4 32 -1 Z" fill="#34d399" fill-opacity="0.75" />
  </g>

  <!-- Central Brand Name -->
  <text x="428" y="132" text-anchor="middle" class="brand-title-glow" filter="url(#emeraldBlur)">ARMONE</text>
  <text x="428" y="132" text-anchor="middle" class="brand-title">ARMONE</text>

  <!-- Emerald Divider -->
  <rect x="235" y="148" width="380" height="1.5" fill="url(#lineGrad)" />
  <circle cx="425" cy="148.75" r="3" fill="#10b981" />
  <circle cx="425" cy="148.75" r="1.2" fill="#ffffff" />

  <!-- Subtitle -->
  <text x="425" y="174" text-anchor="middle" class="sub-title">Software Engineer · Systems, Desktop &amp; Web</text>

  <!-- Tagline Quote / Mission -->
  <text x="425" y="199" text-anchor="middle" class="tagline-text">const focus = "clean architecture · resilient systems · continuous learning";</text>

  <!-- Tech Capsule Pills -->
  <g transform="translate(145, 217)">
    <rect x="0" y="0" width="125" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#38bdf8" />
    <text x="70" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#f1f5f9">Tauri &amp; Desktop</text>

    <rect x="140" y="0" width="125" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="152" cy="11" r="3.5" fill="#34d399" />
    <text x="210" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#f1f5f9">Next.js &amp; React</text>

    <rect x="280" y="0" width="135" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="292" cy="11" r="3.5" fill="#818cf8" />
    <text x="355" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#f1f5f9">TypeScript &amp; Rust</text>

    <rect x="430" y="0" width="130" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="442" cy="11" r="3.5" fill="#fbbf24" />
    <text x="502" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#f1f5f9">Python &amp; Pipelines</text>
  </g>
</svg>