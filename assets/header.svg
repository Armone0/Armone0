<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="40%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#16080b" />
    </linearGradient>

    <!-- Crimson Moon Radial Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ff1a3c" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#990017" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#4d000c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06090e" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a3c" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff1a3c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ff1a3c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff1a3c" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .title {
        font-family: 'Cinzel', serif, Georgia;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 12px;
        fill: #ffffff;
      }
      .title-glow {
        font-family: 'Cinzel', serif, Georgia;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 12px;
        fill: #ff1a3c;
        opacity: 0.6;
      }
      .subtitle {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 14px;
        letter-spacing: 4px;
        text-transform: uppercase;
        fill: #ff8597;
      }
      .tagline {
        font-family: 'Cinzel', serif, Georgia;
        font-style: italic;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 2px;
        fill: #8b949e;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="850" height="260" rx="12" fill="url(#bg)" />

  <!-- Crimson Eclipse Atmosphere -->
  <circle cx="425" cy="85" r="180" fill="url(#moonGlow)" />

  <!-- Subtle Ambient Stars/Specks -->
  <g opacity="0.35">
    <circle cx="85" cy="45" r="1" fill="#fff" />
    <circle cx="140" cy="180" r="1.5" fill="#ff4d6d" />
    <circle cx="210" cy="70" r="1" fill="#fff" />
    <circle cx="310" cy="190" r="1" fill="#fff" />
    <circle cx="550" cy="50" r="1.5" fill="#ff4d6d" />
    <circle cx="680" cy="160" r="1" fill="#fff" />
    <circle cx="760" cy="65" r="1.2" fill="#fff" />
    <circle cx="790" cy="210" r="1" fill="#ff4d6d" />
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="848" height="258" rx="11" fill="none" stroke="#251216" stroke-width="1.5" />
  <rect x="8" y="8" width="834" height="244" rx="8" fill="none" stroke="#ff1a3c" stroke-opacity="0.12" stroke-width="1" />

  <!-- Corner Runes / Accents -->
  <path d="M 16 28 L 28 16" stroke="#ff1a3c" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M 834 28 L 822 16" stroke="#ff1a3c" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M 16 232 L 28 244" stroke="#ff1a3c" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M 834 232 L 822 244" stroke="#ff1a3c" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Central Title -->
  <text x="431" y="98" text-anchor="middle" class="title-glow" filter="url(#glow)">ARMONE</text>
  <text x="431" y="98" text-anchor="middle" class="title">ARMONE</text>

  <!-- Crimson Divider Line -->
  <rect x="225" y="122" width="400" height="1.5" fill="url(#lineGrad)" />
  <circle cx="425" cy="122.75" r="3.5" fill="#ff1a3c" />
  <circle cx="425" cy="122.75" r="1.5" fill="#ffffff" />

  <!-- Subtitle -->
  <text x="425" y="152" text-anchor="middle" class="subtitle">Software Engineer · Systems, Desktop &amp; Web</text>

  <!-- Tagline Quote -->
  <text x="425" y="188" text-anchor="middle" class="tagline">"May you find your worth in the waking world."</text>

  <!-- Tech Capsule Pills -->
  <g transform="translate(160, 212)">
    <rect x="0" y="0" width="115" height="22" rx="11" fill="#141922" stroke="#30363d" stroke-width="1" />
    <text x="57" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#61dafb">Next.js &amp; React</text>

    <rect x="130" y="0" width="115" height="22" rx="11" fill="#141922" stroke="#30363d" stroke-width="1" />
    <text x="187" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#3178c6">TypeScript &amp; Rust</text>

    <rect x="260" y="0" width="115" height="22" rx="11" fill="#141922" stroke="#30363d" stroke-width="1" />
    <text x="317" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#ff8597">Tauri &amp; Systems</text>

    <rect x="390" y="0" width="135" height="22" rx="11" fill="#141922" stroke="#30363d" stroke-width="1" />
    <text x="457" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#5eead4">Three.js &amp; Creative</text>
  </g>
</svg>
